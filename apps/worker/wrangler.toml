# ============================================================================
# デプロイは必ず環境を明示すること（viteプラグインがビルド時に環境を焼き込む方式。
# wrangler deploy の --env は .wrangler/deploy リダイレクトにより無視されるので使わない）:
#   dev:  pnpm run deploy:dev
#   prod: VITE_LIFF_ID=<本番LIFF> VITE_BOT_BASIC_ID=@<本番BotID> pnpm run deploy:prod
#         (= CLOUDFLARE_ENV=prod vite build && wrangler deploy --config dist/line_harness/wrangler.json)
# 出力の "Uploaded <名前>" が期待の worker 名か必ず確認する（dev=line-harness / prod=line-harness-prod）。
# 詳細: docs/furimauto/prod-build-runbook.md STEP4
# ============================================================================
name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "f2b335f4f9d276383643c76f1e5cc6f9"

[assets]
directory = "dist/client"
binding = "ASSETS"

# ※ rebase検証中だけ line-crm-rebase に向けている。検証後は line-crm(4b46e187…) に戻す
[[d1_databases]]
binding = "DB"
database_name = "line-crm-rebase"
database_id = "2fa9387e-61fb-4f81-9b18-4087837feabd"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# 拡張の認証（/api/ext/v1/key-code-set）のキャッシュ。D1 furim_customers が正で KV は 60 秒の写し（Capsec #245）
[[kv_namespaces]]
binding = "FURIM_EXT_CACHE"
id = "d8574e633feb478088074d0756494352"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# Workers Logs。webhookの処理は waitUntil で走るため失敗しても外から追跡できず、
# 「GASは成功しているのにLINEへ返信されない」の調査ができなかった（2026-08-12 小笠さん事象）。
# 有効にするとダッシュボード/APIから過去のconsoleログとエラーを追える。
[observability]
enabled = true

[vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "4b46e187-36e2-467f-87d4-24d07953d802"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.furimuato.workers.dev"
ADMIN_PUBLIC_URL = "https://furim-dev.line-harness-admin-7je.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness.furimuato.workers.dev"
CF_ACCOUNT_ID = "f2b335f4f9d276383643c76f1e5cc6f9"
# 管理UI(Pages)はworkerとクロスサイト。CORS許可＋SameSite=None cookie に必要。
ADMIN_ORIGIN = "https://furim-dev.line-harness-admin-7je.pages.dev"
ADMIN_ALLOW_CROSS_SITE = "true"
# アンバサダー紹介offer（dev=line-crm-rebase で作成した id）。deploy:dev はこのトップレベル
# [vars] を焼き込む。ref がこのofferの affiliate_link なら URL経由紹介処理を走らせる。
FURIM_AMBASSADOR_OFFER_ID = "e1fa71aa-2d1d-4fb6-8daa-0e448c95ad32"
# コピー出品チケット決済 LIFF と単価別 PriceID（GAS getTicketCheckoutUrl の移植・Capsec #243）。
# dev はテスト Stripe の PriceID（dev シート「チケット単価一覧」と同値）
FURIM_TICKET_LIFF_URL = "https://liff.line.me/1661091589-dduTkcxr"
FURIM_TICKET_PRICE_IDS = '{"15":"price_1SFCnRF2C7KcCkFfwuJjlCnl","14":"price_1SFpRyF2C7KcCkFfAtxvQ9ug","13":"price_1SFpS5F2C7KcCkFfkMV4iadi","10":"price_1SFpSAF2C7KcCkFfC8HafSTC"}'

# ─── DEV環境（Worker名: line-harness）────────────────────────────────────────
[env.dev]
name = "line-harness"
workers_dev = true

[env.dev.assets]
directory = "dist/client"
binding = "ASSETS"

# ※ rebase検証中だけ line-crm-rebase に向けている。検証後は line-crm(4b46e187…) に戻す
[[env.dev.d1_databases]]
binding = "DB"
database_name = "line-crm-rebase"
database_id = "2fa9387e-61fb-4f81-9b18-4087837feabd"

[[env.dev.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[[env.dev.kv_namespaces]]
binding = "FURIM_EXT_CACHE"
id = "d8574e633feb478088074d0756494352"

[env.dev.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[env.dev.vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "4b46e187-36e2-467f-87d4-24d07953d802"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.furimuato.workers.dev"
ADMIN_PUBLIC_URL = "https://furim-dev.line-harness-admin-7je.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness.furimuato.workers.dev"
CF_ACCOUNT_ID = "f2b335f4f9d276383643c76f1e5cc6f9"
ADMIN_ORIGIN = "https://furim-dev.line-harness-admin-7je.pages.dev"
ADMIN_ALLOW_CROSS_SITE = "true"
# アンバサダー紹介offer（dev=line-crm-rebase で作成した id）。ref がこのofferの
# affiliate_link なら URL経由の紹介成立処理を走らせる。prodは別値。
FURIM_AMBASSADOR_OFFER_ID = "e1fa71aa-2d1d-4fb6-8daa-0e448c95ad32"
# コピー出品チケット決済 LIFF と単価別 PriceID（dev=テスト Stripe。Capsec #243）
FURIM_TICKET_LIFF_URL = "https://liff.line.me/1661091589-dduTkcxr"
FURIM_TICKET_PRICE_IDS = '{"15":"price_1SFCnRF2C7KcCkFfwuJjlCnl","14":"price_1SFpRyF2C7KcCkFfAtxvQ9ug","13":"price_1SFpS5F2C7KcCkFfkMV4iadi","10":"price_1SFpSAF2C7KcCkFfC8HafSTC"}'

# ─── PROD環境（Worker名: line-harness-prod）─────────────────────────────────
[env.prod]
workers_dev = true

[env.prod.assets]
directory = "dist/client"
binding = "ASSETS"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "line-crm-prod"
database_id = "24650d0d-e165-4220-9ebe-9a5fab202d7c"

[[env.prod.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# prod-FURIM_EXT_CACHE（dev とは別 namespace）
[[env.prod.kv_namespaces]]
binding = "FURIM_EXT_CACHE"
id = "0e6c4e7a19d047b9a4a4ca1044c29967"

[env.prod.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# SNS等に貼る短縮リンクを自社ドメインで出すためのルート（2026-08-20 Cloudflare移行）。
# workers.dev のままだと見慣れないドメインでクリック率に響くため。
# `/r/` は WordPress に存在しないパスなので Xserver 側とは衝突しない。
# 既存の workers.dev URL も生き続けるので、過去に配ったリンクは壊れない。
[[env.prod.routes]]
pattern = "furimauto.com/r/*"
zone_name = "furimauto.com"

[env.prod.vars]
WORKER_NAME = "line-harness-prod"
ADMIN_PAGES_PROJECT = "line-harness-admin-prod"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "24650d0d-e165-4220-9ebe-9a5fab202d7c"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness-prod.furimuato.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin-prod-6mo.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness-prod.furimuato.workers.dev"
CF_ACCOUNT_ID = "f2b335f4f9d276383643c76f1e5cc6f9"
ADMIN_ORIGIN = "https://line-harness-admin-prod-6mo.pages.dev"
ADMIN_ALLOW_CROSS_SITE = "true"
# アンバサダー紹介offer（prod=line-crm-prod で作成した id。devとは別値）。
FURIM_AMBASSADOR_OFFER_ID = "5468b932-575d-454e-8628-9f2d32402f10"
# コピー出品チケット決済 LIFF と単価別 PriceID（prod=本番 Stripe。本番シート「チケット単価一覧」と同値。Capsec #243）
FURIM_TICKET_LIFF_URL = "https://liff.line.me/1660804123-VgnRNDJm"
FURIM_TICKET_PRICE_IDS = '{"15":"price_1SFCiyF2C7KcCkFfzJ7IuaTA","14":"price_1SFpOcF2C7KcCkFfZlbmPgiW","13":"price_1SFpOjF2C7KcCkFfR6lqZEo0","10":"price_1SFpOpF2C7KcCkFf27Ygjrl2"}'
