name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
account_id = "f2b335f4f9d276383643c76f1e5cc6f9"

# Static assets (LIFF pages) served by Workers Assets
# SPA fallback ensures all non-API paths serve index.html
[assets]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "4b46e187-36e2-467f-87d4-24d07953d802"

# [[r2_buckets]]
